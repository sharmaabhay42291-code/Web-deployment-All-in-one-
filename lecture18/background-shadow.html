<!DOCTYPE html>
<html>
<head>
    <title>Background and Shadow</title>

    <style>

        body {
       
            font-family: Arial;
            background-color: white;
        }

        .box {
            width: 400px;
            height: 250px;

         

            border: 2px solid black;

            box-shadow: -10px -10px 10px gray;

            text-align: center;
            padding: 20px;
            margin: 100px auto;
            background-color: white;
            background-image: url("https://th.bing.com/th/id/OIP.MwMe2gLbSOYp1mKkXqJPwgHaE8?w=236&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" );
background-size: 100% 100%;
background-position: center;
        }

        h1 {
            color: white;

            text-shadow: 2px 2px 5px gray;
        }

        .box2 {
            width: 200px;
            height: 100px;

            background-color:white;

            box-shadow: 5px 5px 10px black;

            margin: 30px auto;
        }

    </style>
</head>

<body>

    <div class="box">

        <h1>Hello Abhay</h1>

        <p>
            This is a simple example of
            Background and Shadow Properties.
        </p>

        <div class="box2">
            Shadow Box
        </div>

    </div>

</body>
</html>
