<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 800px;
            height: 400px;

            border: 3px solid black;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 20px;
        }

        .box {
            height: 100px;
            width: 100px;

            border: 3px solid black;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Flexbox Example</h1>

    <div class="container">

        <div class="box">Box 1</div>

        <div class="box">Box 2</div>

        <div class="box">Box 3</div>

    </div>

</body>

</html>
