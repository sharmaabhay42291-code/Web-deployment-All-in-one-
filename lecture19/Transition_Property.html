<!DOCTYPE html>
<html>
<head>
    <title>Transition Property</title>

    <style>

        .box {
            width: 200px;
            height: 100px;

            background-color: orange;

            text-align: center;
            padding-top: 30px;

            transition: 0.5s;
        }

        .box:hover {
            width: 300px;
            background-color: blue;
            color: white;
            
         
        }

    </style>
</head>

<body>

    <div class="box">
        Hover Me
    </div>

</body>
</html>
